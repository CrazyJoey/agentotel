# AgentOTel — system nginx site config for prod (47.237.100.232)
# Install: sudo cp deploy/nginx/agentotel.conf /etc/nginx/conf.d/agentotel.conf
# Reload:  sudo nginx -t && sudo systemctl reload nginx
#
# Listens on:
#   :80   — production domain, canonical (agentotel.cloud → 47.237.100.232)
#   :8088 — legacy port kept for backward-compat with old bookmarks / dev habit
# Both ports serve identical content via the shared config below.

server {
    listen 80;
    listen 8088;
    server_name agentotel.cloud _;

    # Static frontend (served from git checkout)
    root /home/admin/agentotel/front;
    index index.html;

    # Backend API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/agentotel.access.log;
    error_log  /var/log/nginx/agentotel.error.log;
}
