receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  agentotel:
    default_agent_name: hermes-agent
  batch:
    timeout: 1s
    send_batch_size: 128

exporters:
  agentotelclickhouse:
    endpoint: http://127.0.0.1:8123
    database: agentotel_project_proj_c9a73efa88944295
    project_id: proj_c9a73efa88944295
    environment: default
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [agentotel, batch]
      exporters: [agentotelclickhouse, debug]
