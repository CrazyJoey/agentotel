receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  agentotel:
    default_agent_name: hermes-agent
  batch:
    timeout: 1s
    send_batch_size: 128
    metadata_keys: [authorization]

exporters:
  agentotelclickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: ${env:CLICKHOUSE_DATABASE}
    project_id: ${env:AGENTOTEL_PROJECT_ID}
    environment: ${env:AGENTOTEL_ENVIRONMENT}
    username: ${env:CLICKHOUSE_USERNAME}
    password: ${env:CLICKHOUSE_PASSWORD}
    api_key_id: ""
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [agentotel, batch]
      exporters: [agentotelclickhouse, debug]
