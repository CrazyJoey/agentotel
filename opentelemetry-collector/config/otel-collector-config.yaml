receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  otlp_http/backend:
    traces_endpoint: http://host.containers.internal:8091/v1/traces
    encoding: json
    compression: none
    headers:
      Authorization: "Bearer ${env:AGENTOTEL_API_KEY}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_http/backend]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
