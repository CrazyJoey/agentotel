services:
  front:
    build: ./front
    container_name: agentotel-front
    ports:
      - "8088:8088"
    environment:
      MISSION_CONTROL_BACKEND_HOST: server
      MISSION_CONTROL_BACKEND_PORT: "8090"
      AGENT_OBSERVABILITY_BACKEND_HOST: server
      AGENT_OBSERVABILITY_BACKEND_PORT: "8091"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./server/backend-api
    container_name: agentotel-server
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      CLICKHOUSE_DB: agent_observability
      CLICKHOUSE_URL: http://clickhouse:8123/?database=agent_observability
      PROJECT_ID: default
      ENVIRONMENT: default
      MYSQL_HOST: ${MYSQL_HOST:?set MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-agentotel_meta}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: docker.m.daocloud.io/clickhouse/clickhouse-server:latest
    container_name: agentotel-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: agent_observability
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  opentelemetry-collector:
    image: docker.m.daocloud.io/otel/opentelemetry-collector:latest
    container_name: agentotel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      AGENTOTEL_API_KEY: ${AGENTOTEL_API_KEY:?set AGENTOTEL_API_KEY}
    volumes:
      - ./opentelemetry-collector/config/otel-collector-config.compose.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - server
    restart: unless-stopped

volumes:
  clickhouse-data:
